<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Звуки двора</title>
  <style>
    body { margin: 0; padding: 32px; background: #171b27; color: #f4f0df; font: 16px system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; }
    h1 { margin-bottom: 8px; }
    p { color: #bec5d2; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 24px 0; }
    button { padding: 14px; border: 2px solid #07080d; border-radius: 8px; background: #f5b842; color: #171b27; font: bold 16px system-ui; cursor: pointer; box-shadow: 3px 3px #07080d; }
    button:hover { background: #ffdb79; }
    label { display: block; margin: 18px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Звуки двора</h1>
    <p>Нажми кнопку, чтобы запустить WebAudio. Выстрелы и перезарядки огнестрела используют сэмплы F8 Studios, остальные звуки синтезируются.</p>
    <h2>Синтез</h2>
    <div class="grid" id="sounds"></div>
    <h2>Сэмплы</h2>
    <div class="grid" id="samples"></div>
    <h2>Оружие</h2>
    <div class="grid" id="weapons"></div>
    <label><input type="checkbox" id="music"> Музыка лобби</label>
    <label>Громкость <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8"></label>
  </main>
  <script src="../public/weapons.js"></script>
  <script src="../public/sfx.js"></script>
  <script>
    var names = ['shot', 'boom', 'jump', 'land', 'hop', 'coffee', 'smoke', 'code_ok', 'code_fail', 'plant', 'defuse', 'turret', 'kill', 'round', 'buy'];
    var hops = 0;
    names.forEach(function (name) {
      var button = document.createElement('button');
      button.textContent = name;
      button.addEventListener('click', function () {
        SFX.play(name, name === 'hop' ? { n: hops++ % 8 } : undefined);
      });
      document.getElementById('sounds').appendChild(button);
    });
    var sampleNames = ['shot_22', 'shot_556', 'shot_762', 'shot_54r', 'shot_double',
      'reload_ar', 'reload_ak', 'reload_pump', 'bolt_mosin', 'rack_pistol'];
    sampleNames.forEach(function (name) {
      var button = document.createElement('button');
      button.textContent = name;
      button.addEventListener('click', function () {
        SFX.play(name.indexOf('shot_') === 0 ? 'shot' : 'reload', { sample: name });
      });
      document.getElementById('samples').appendChild(button);
    });
    Object.keys(WEAPONS.SHOP).filter(function (id) { return WEAPONS.SHOP[id].sfx; }).forEach(function (id) {
      ['shot', 'reload'].forEach(function (kind) {
        var button = document.createElement('button');
        button.textContent = WEAPONS.SHOP[id].name + ' · ' + kind;
        button.addEventListener('click', function () { SFX.play(kind, { weapon: id }); });
        document.getElementById('weapons').appendChild(button);
      });
    });
    document.getElementById('music').addEventListener('change', function (event) { SFX.music(event.target.checked); });
    document.getElementById('volume').addEventListener('input', function (event) { SFX.volume(Number(event.target.value)); });
  </script>
</body>
</html>
